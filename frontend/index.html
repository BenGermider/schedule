<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Schedule</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="left">
				<button id="prevDay" title="Previous day">◀</button>
				<button id="todayBtn" title="Today">Today</button>
				<button id="nextDay" title="Next day">▶</button>
			</div>
			<div class="center">
				<input type="date" id="datePicker" />
				<h1 id="dateTitle"></h1>
			</div>
			<div class="right">
				<button id="addEventBtn">+ Add</button>
			</div>
		</header>

		<main class="content">
			<div class="day-container">
				<div class="grid-scroll" id="gridScroll">
					<div class="hours" id="hours"></div>
					<div class="timeline" id="timeline"></div>
				</div>
			</div>
		</main>
	</div>

	<div class="modal hidden" id="eventModal">
		<div class="modal-content">
			<h2 id="modalTitle">Add Event</h2>
			<form id="eventForm">
				<input type="hidden" id="eventId" />
				<label>Title
					<input type="text" id="titleInput" required maxlength="200" />
				</label>
				<label>Description
					<textarea id="descInput" maxlength="2000"></textarea>
				</label>
				<div class="row">
					<label>Date
						<input type="date" id="dateInput" required />
					</label>
					<label>Start
						<input type="time" id="startInput" required step="60" />
					</label>
					<label>End
						<input type="time" id="endInput" required step="60" />
					</label>
				</div>
				<div class="actions">
					<button type="submit" id="saveBtn">Save</button>
					<button type="button" id="deleteBtn" class="danger hidden">Delete</button>
					<button type="button" id="cancelBtn">Cancel</button>
				</div>
			</form>
		</div>
	</div>

	<script src="/app.js"></script>
</body>
</html>
